# Language settings: 'es' for Spanish, 'en' for English
language: en

# TAB config ownership: off (never write), once (write once), or force (write every startup)
tab:
  setup-mode: once
  setup-completed: false

# Extra public account names used only as skin sources when match players do not
# provide enough unique resolvable skins. Replace or extend this list with known
# accounts that have distinct skins.
skins:
  fallback-roster:
    - ElRichMC
    - Notch
    - jeb_
    - Dinnerbone
    - Grumm
    - Technoblade
    - Dream
    - Grian
    - MumboJumbo
    - BdoubleO100
    - EthosLab
    - GoodTimesWithScar
    - CaptainSparklez

# Internal one-time data migrations. Do not reset these markers.
migrations:
  legacy-bare-teams: false

# Native item-sprite roulette shown in the action bar.
item-roulette:
  steps: 24
  initial-delay-ticks: 2
  final-delay-ticks: 10
  result-hold-ticks: 40

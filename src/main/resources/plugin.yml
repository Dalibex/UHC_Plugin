name: ELOUD_UHC
version: "${version}"
main: me.dalibex.UHC_DBasic.UHC_DBasic
api-version: "1.21"
authors: [Dalibex]
depend: ["TAB", "SkinsRestorer"]

commands:
  uhcadmin:
    description: Opens the administration panel with UHC settings
    usage: /uhcadmin
  uhccommands:
    description: Shows the list of UHC_DBasic plugin commands
    usage: /uhccommands
  start:
    description: Starts the UHC process (creates wall)
    usage: /start [size]
  confirmstart:
    description: Internal command to confirm the game start (no manual use needed)
    usage: Called automatically by "/start" for confirmation
  cancelstart:
    description: Internal command to cancel the game start (no manual use needed)
    usage: Called automatically when cancelling the start action
  reset:
    description: Prepares the world and puts it on standby for "/start"
    usage: /reset
  team:
    description: Creates or renames your team, whether of 1, 2, 3 or 4 players
    usage: /team [name]
  settime:
    description: Adjusts the time manually
    usage: /settime <hours> <minutes> <seconds>
  lang:
    description: Changes the language
    usage: /lang [language]
  assignteam:
    description: Assigns a player to a team manually (admin)
    usage: /assignteam <player> <team>
  abandon:
    description: Marks yourself (or another player as admin) as eliminated from the running game, offline or online
    usage: /abandon [player]
  setteamepisode:
    description: Sets the episode in which teams are formed (compasses are given)
    usage: /setteamepisode <episode 1-10>
    permission: uhc.admin
  setpvpepisode:
    description: Sets the episode in which PVP is enabled
    usage: /setpvpepisode <episode 1-10>
    permission: uhc.admin

permissions:
  uhc.admin:
    description: Allows full administration of the UHC game (panel, start/reset, teams, time, abandon)
    default: op
